<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Gestión de Espacios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    td, th {
      text-align: center;
      vertical-align: middle;
    }
    .calendar-table {
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="p-4">

  <div class="container">
    <h2 class="mb-4">Gestión de Espacios</h2>

    <!-- Crear nuevo espacio -->
    <div class="mb-3">
      <button class="btn btn-primary" onclick="crearNuevoEspacio()">Crear nuevo espacio</button>
    </div>

    <!-- Selección de espacio -->
    <div class="mb-4">
      <label for="espacios">Seleccionar Espacio:</label>
      <select id="espacios" class="form-select" onchange="actualizarCalendario()">
        <option value="prueba1">prueba1</option>
      </select>
    </div>

    <!-- Calendario -->
    <table class="table table-bordered calendar-table">
      <thead>
        <tr>
          <th>Hora</th>
          <th>Lunes</th>
          <th>Martes</th>
          <th>Miércoles</th>
          <th>Jueves</th>
          <th>Viernes</th>
          <th>Sábado</th>
        </tr>
      </thead>
      <tbody id="calendario-body"></tbody>
    </table>

    <!-- Botón para agregar clase -->
    <div class="mt-3">
      <a href="formulario.html" class="btn btn-success">Agregar Clase</a>
    </div>
  </div>

<script>
  const horas = [];
  for (let h = 9; h < 21; h++) {
    horas.push(`${String(h).padStart(2, '0')}:00`);
    horas.push(`${String(h).padStart(2, '0')}:30`);
  }

  function cargarClases() {
    const data = localStorage.getItem("clases");
    return data ? JSON.parse(data) : {};
  }

  function actualizarCalendario() {
    const espacio = document.getElementById("espacios").value;
    const tbody = document.getElementById("calendario-body");
    tbody.innerHTML = "";

    const clases = cargarClases();
    const clasesDelEspacio = clases[espacio] || [];

    horas.forEach(hora => {
      const row = document.createElement("tr");
      const th = document.createElement("th");
      th.textContent = hora;
      row.appendChild(th);

      const dias = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
      dias.forEach(dia => {
        const td = document.createElement("td");
        const clase = clasesDelEspacio.find(c =>
          c.dias.includes(dia) &&
          hora >= c.inicio &&
          hora < c.fin
        );
        td.textContent = clase ? clase.nombre : "";
        row.appendChild(td);
      });

      tbody.appendChild(row);
    });
  }

  function crearNuevoEspacio() {
    const nombre = prompt("Nombre del nuevo espacio:");
    if (nombre) {
      const select = document.getElementById("espacios");
      const option = document.createElement("option");
      option.value = nombre;
      option.textContent = nombre;
      select.appendChild(option);
      select.value = nombre;

      const clases = cargarClases();
      clases[nombre] = [];
      localStorage.setItem("clases", JSON.stringify(clases));

      actualizarCalendario();
    }
  }

  window.onload = () => {
    const clases = cargarClases();
    const select = document.getElementById("espacios");
    for (const espacio in clases) {
      if (![...select.options].some(o => o.value === espacio)) {
        const option = document.createElement("option");
        option.value = espacio;
        option.textContent = espacio;
        select.appendChild(option);
      }
    }
    actualizarCalendario();
  };
</script>

</body>
</html>
