<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Horario y Gestión de Clases</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #ff9966, #ffcc66);
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    h1, h2, h3 {
      text-align: center;
      color: #fff;
      text-shadow: 1px 1px 3px #000;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #fff;
      text-align: center;
      padding: 10px;
      font-size: 0.8em;
      vertical-align: middle;
    }

    th {
      background-color: #ff1493;
      color: #fff;
    }

    .form-section, .container-section {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      margin-top: 40px;
    }

    .calendar-table {
      font-size: 0.85rem;
    }

    .form-check-inline {
      margin-right: 10px;
    }
  </style>
</head>
<body>

  <h1>Horario Adolescentes y Adultos</h1>

  <table id="horario-dinamico">
    <thead>
      <tr>
        <th>Hora</th>
        <th>Lunes</th>
        <th>Martes</th>
        <th>Miércoles</th>
        <th>Jueves</th>
        <th>Viernes</th>
        <th>Sábado</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="container-section">
    <h2>Gestión de Espacios y Clases</h2>

    <div class="mb-3">
      <button class="btn btn-primary" onclick="crearNuevoEspacio()">Crear nuevo espacio</button>
    </div>

    <div class="mb-3">
      <label>Seleccionar espacio:</label>
      <select id="espacios" class="form-select" onchange="actualizarCalendario()"></select>
    </div>

    <table class="table table-bordered calendar-table">
      <thead>
        <tr>
          <th>Hora</th>
          <th>Lunes</th>
          <th>Martes</th>
          <th>Miércoles</th>
          <th>Jueves</th>
          <th>Viernes</th>
          <th>Sábado</th>
        </tr>
      </thead>
      <tbody id="calendario-body"></tbody>
    </table>
  </div>

  <div class="form-section">
    <h3>Agregar Nueva Clase</h3>

    <form id="claseForm" onsubmit="guardarClase(event)">
      <div class="mb-3">
        <label>Espacio:</label>
        <select id="espacio" class="form-select"></select>
      </div>

      <div class="mb-3">
        <label>Nombre de la clase:</label>
        <input type="text" id="nombre" class="form-control" required>
      </div>

      <div class="mb-3">
        <label>Maestro:</label>
        <select id="maestro" class="form-select">
          <option value="Lucía">Lucía</option>
        </select>
        <button type="button" class="btn btn-link" onclick="agregarMaestro()">Agregar nuevo maestro</button>
        <input type="text" id="nuevoMaestro" class="form-control mt-2 d-none" placeholder="Nombre del nuevo maestro">
      </div>

      <div class="mb-3">
        <label>Días:</label><br>
        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="Lunes">Lunes</div>
        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="Martes">Martes</div>
        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="Miércoles">Miércoles</div>
        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="Jueves">Jueves</div>
        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="Viernes">Viernes</div>
        <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" value="Sábado">Sábado</div>
      </div>

      <div class="mb-3">
        <label>Hora Inicio:</label>
        <input type="time" id="inicio" class="form-control" required>
        <label>Hora Fin:</label>
        <input type="time" id="fin" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-success">Guardar Clase</button>
    </form>
  </div>

  <script>
    const horas = [];
    for (let h = 9; h < 21; h++) {
      horas.push(`${String(h).padStart(2, '0')}:00`);
      horas.push(`${String(h).padStart(2, '0')}:30`);
    }

    function agregarMaestro() {
      document.getElementById('nuevoMaestro').classList.remove('d-none');
    }

    function cargarClases() {
      const data = localStorage.getItem("clases");
      return data ? JSON.parse(data) : {};
    }

    function guardarClases(data) {
      localStorage.setItem("clases", JSON.stringify(data));
    }

    function guardarClase(e) {
      e.preventDefault();

      const espacio = document.getElementById("espacio").value;
      const nombreClase = document.getElementById("nombre").value;
      const maestroSelect = document.getElementById("maestro");
      const nuevoMaestro = document.getElementById("nuevoMaestro").value;
      const maestro = nuevoMaestro || maestroSelect.value;
      const inicio = document.getElementById("inicio").value;
      const fin = document.getElementById("fin").value;
      const dias = Array.from(document.querySelectorAll("input[type='checkbox']:checked")).map(cb => cb.value);

      const clasesData = cargarClases();
      clasesData[espacio] = clasesData[espacio] || [];

      const hayEmpalme = clasesData[espacio].some(clase =>
        dias.some(dia =>
          clase.dias.includes(dia) &&
          !(fin <= clase.inicio || inicio >= clase.fin)
        )
      );

      if (hayEmpalme) {
        alert("❌ NO SE PUEDE AGREGAR CLASE: EMPALME DETECTADO");
        return;
      }

      clasesData[espacio].push({ nombre: nombreClase, maestro, dias, inicio, fin });
      guardarClases(clasesData);

      alert("✅ Clase agregada exitosamente");
      actualizarEspacios();
      actualizarCalendario();
      pintarHorarioColorido();
    }

    function crearNuevoEspacio() {
      const nombre = prompt("Nombre del nuevo espacio:");
      if (nombre) {
        const clases = cargarClases();
        clases[nombre] = [];
        guardarClases(clases);
        actualizarEspacios();
      }
    }

    function actualizarEspacios() {
      const selectEspacios = document.getElementById("espacios");
      const selectFormulario = document.getElementById("espacio");
      const clases = cargarClases();

      selectEspacios.innerHTML = "";
      selectFormulario.innerHTML = "";

      for (const espacio in clases) {
        const option1 = document.createElement("option");
        option1.value = espacio;
        option1.textContent = espacio;
        selectEspacios.appendChild(option1);

        const option2 = document.createElement("option");
        option2.value = espacio;
        option2.textContent = espacio;
        selectFormulario.appendChild(option2);
      }
    }

    function actualizarCalendario() {
      const espacio = document.getElementById("espacios").value;
      const tbody = document.getElementById("calendario-body");
      tbody.innerHTML = "";

      const clases = cargarClases();
      const clasesDelEspacio = clases[espacio] || [];

      horas.forEach(hora => {
        const row = document.createElement("tr");
        const th = document.createElement("th");
        th.textContent = hora;
        row.appendChild(th);

        const dias = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
        dias.forEach(dia => {
          const td = document.createElement("td");
          const clase = clasesDelEspacio.find(c =>
            c.dias.includes(dia) && hora >= c.inicio && hora < c.fin
          );
          td.textContent = clase ? clase.nombre : "";
          row.appendChild(td);
        });

        tbody.appendChild(row);
      });

      pintarHorarioColorido();
    }

    function pintarHorarioColorido() {
      const espacio = document.getElementById("espacios").value;
      const tabla = document.querySelector("#horario-dinamico tbody");
      tabla.innerHTML = "";

      const clases = cargarClases();
      const clasesDelEspacio = clases[espacio] || [];

      const dias = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];

      horas.forEach(hora => {
        const row = document.createElement("tr");
        const th = document.createElement("th");
        th.textContent = hora;
        row.appendChild(th);

        dias.forEach(dia => {
          const td = document.createElement("td");
          const clase = clasesDelEspacio.find(c =>
            c.dias.includes(dia) && hora >= c.inicio && hora < c.fin
          );

          if (clase) {
            td.innerHTML = `<strong>${clase.nombre}</strong><br><small>${clase.maestro}</small>`;
            td.style.backgroundColor = obtenerColor(clase.nombre);
            td.style.color = "#000";
            td.style.fontSize = "0.8em";
          } else {
            td.textContent = "";
          }

          row.appendChild(td);
        });

        tabla.appendChild(row);
      });
    }

    function obtenerColor(nombre) {
      const colores = {
        "Piano": "#87cefa",
        "Jazz": "#ffd700",
        "Danza Contemporánea": "#ffd700",
        "Ballet": "#dda0dd",
        "Movimiento Acrobático": "#90ee90",
        "Capoeira": "#ff6347",
        "Acond. Dancístico": "#ffb6c1",
        "Danza Urbana": "#90ee90",
        "Arte Experimental": "#dda0dd",
        "Dan Ser Escénico": "#afeeee",
        "Acrodanza": "#ffa07a",
      };

      if (!colores[nombre]) {
        const hash = Array.from(nombre).reduce((acc, char) => acc + char.charCodeAt(0), 0);
        const r = (hash * 33) % 255;
        const g = (hash * 77) % 255;
        const b = (hash * 11) % 255;
        return `rgb(${r},${g},${b})`;
      }

      return colores[nombre];
    }

    window.onload = () => {
      actualizarEspacios();
      actualizarCalendario();
    };
  </script>

</body>
</html>
