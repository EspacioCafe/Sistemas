<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horario Adolescentes y Adultos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #ff9966, #ffcc66);
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #fff;
      text-shadow: 1px 1px 3px #000;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #fff;
      text-align: center;
      padding: 10px;
      font-size: 0.9em;
      font-weight: bold;
      position: relative;
    }

    th {
      background-color: #ff1493;
      color: #fff;
    }

    .pink { background-color: #ffb6c1; }
    .blue { background-color: #87cefa; }
    .yellow { background-color: #ffd700; }
    .orange { background-color: #ffa07a; }
    .green { background-color: #90ee90; }
    .red { background-color: #ff6347; }
    .purple { background-color: #dda0dd; }
    .lightblue { background-color: #afeeee; }
    .white { background-color: #fff; }

    .add-class-btn {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 1em;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .class-form {
      display: none;
      position: fixed;
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      z-index: 10;
      width: 300px;
    }

    .class-form input, .class-form select {
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
    }

    .form-buttons {
      display: flex;
      justify-content: space-between;
    }

    .edit-btn {
      position: absolute;
      top: 2px;
      right: 2px;
      background: #000;
      color: #fff;
      font-size: 0.7em;
      padding: 2px 5px;
      cursor: pointer;
      display: none;
    }

    td:hover .edit-btn {
      display: block;
    }

    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.6);
      z-index: 5;
    }
  </style>
</head>
<body>

  <h1>Horario Adolescentes y Adultos</h1>
  <button class="add-class-btn" onclick="openForm()">Agregar Clase</button>

  <div class="overlay" id="overlay" onclick="closeForm()"></div>

  <div class="class-form" id="classForm">
    <h3 id="formTitle">Agregar Clase</h3>
    <input type="text" id="className" placeholder="Nombre de la clase">
    
    <label>Días:</label>
    <select id="classDays" multiple>
      <option value="0">Lunes</option>
      <option value="1">Martes</option>
      <option value="2">Miércoles</option>
      <option value="3">Jueves</option>
      <option value="4">Viernes</option>
      <option value="5">Sábado</option>
    </select>

    <input type="text" id="classTime" placeholder="Horario (ej. 4:00–5:00 PM)">
    
    <label>Maestro:</label>
    <select id="teacherSelect"></select>
    <input type="text" id="newTeacher" placeholder="Nuevo maestro (opcional)">
    
    <label>Categoría:</label>
    <select id="category">
      <option>Danza</option>
      <option>Música</option>
      <option>Artes Plásticas</option>
    </select>

    <label>Espacio:</label>
    <select id="space">
      <option>Salón Danza</option>
      <option>Salón Música</option>
      <option>Consultorio</option>
    </select>

    <label>Color:</label>
    <input type="color" id="classColor">

    <div class="form-buttons">
      <button onclick="saveClass()">Guardar</button>
      <button onclick="deleteClass()" id="deleteBtn" style="display:none;">Eliminar</button>
      <button onclick="closeForm()">Cancelar</button>
    </div>
  </div>

  <table id="scheduleTable">
    <thead>
      <tr>
        <th>Lunes</th>
        <th>Martes</th>
        <th>Miércoles</th>
        <th>Jueves</th>
        <th>Viernes</th>
        <th>Sábado</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="white"></td>
        <td class="white"></td>
        <td class="white"></td>
        <td class="white"></td>
        <td class="white"></td>
        <td class="white"></td>
      </tr>
    </tbody>
  </table>

  <script>
    let currentEditCell = null;
    const teacherSelect = document.getElementById('teacherSelect');
    const teachers = ["Maestro A", "Maestro B"];
    const form = document.getElementById("classForm");

    function openForm(cell = null) {
      document.getElementById('overlay').style.display = 'block';
      form.style.display = 'block';
      currentEditCell = cell;

      if (cell) {
        document.getElementById('formTitle').innerText = "Editar Clase";
        document.getElementById('deleteBtn').style.display = 'inline-block';
        const info = JSON.parse(cell.dataset.info);
        document.getElementById('className').value = info.name;
        document.getElementById('classTime').value = info.time;
        document.getElementById('classColor').value = info.color;
        document.getElementById('category').value = info.category;
        document.getElementById('space').value = info.space;
        document.getElementById('teacherSelect').value = info.teacher;
        [...document.getElementById('classDays').options].forEach(opt => {
          opt.selected = info.days.includes(+opt.value);
        });
      } else {
        form.reset();
        document.getElementById('formTitle').innerText = "Agregar Clase";
        document.getElementById('deleteBtn').style.display = 'none';
      }

      updateTeacherOptions();
    }

    function closeForm() {
      document.getElementById('overlay').style.display = 'none';
      form.style.display = 'none';
      currentEditCell = null;
    }

    function updateTeacherOptions() {
      teacherSelect.innerHTML = teachers.map(t => `<option value="${t}">${t}</option>`).join("");
    }

    function saveClass() {
      const name = document.getElementById('className').value;
      const time = document.getElementById('classTime').value;
      const days = [...document.getElementById('classDays').selectedOptions].map(opt => +opt.value);
      const teacher = document.getElementById('newTeacher').value || document.getElementById('teacherSelect').value;
      const category = document.getElementById('category').value;
      const space = document.getElementById('space').value;
      const color = document.getElementById('classColor').value;

      if (!name || !time || days.length === 0) return alert("Faltan datos");

      if (!teachers.includes(teacher)) teachers.push(teacher);

      days.forEach(day => {
        const cell = document.querySelector(`#scheduleTable tbody tr td:nth-child(${day + 1})`);
        cell.innerHTML = `<div class="edit-btn" onclick="event.stopPropagation(); openForm(this.parentElement)">Editar</div>${time}<br>${name}`;
        cell.style.backgroundColor = color;
        cell.dataset.info = JSON.stringify({ name, time, teacher, color, days, category, space });
      });

      closeForm();
    }

    function deleteClass() {
      if (currentEditCell) {
        currentEditCell.innerHTML = "";
        currentEditCell.style.backgroundColor = "#fff";
        currentEditCell.removeAttribute("data-info");
        closeForm();
      }
    }
  </script>
</body>
</html>
