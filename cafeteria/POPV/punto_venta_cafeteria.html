<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Punto de Venta - Cafetería</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        header {
            background-color: #2d89ef;
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
        }

        .section {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        label {
            font-weight: 600;
            margin-top: 15px;
            display: block;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #2d89ef;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2164c4;
        }
    </style>
</head>
<body>
    <header>
        <h1>Sistema de Punto de Venta - Cafetería</h1>
    </header>

    <div class="container">

        <div class="section">
            <h2>Agregar Proveedor</h2>
            <label>Nombre:</label>
            <input type="text" placeholder="Nombre del proveedor">
            <label>Ubicación:</label>
            <input type="text" placeholder="Ubicación">
            <label>Horarios de atención:</label>
            <input type="text" placeholder="Ej: Lunes a Viernes, 8:00 - 18:00">
            <button>Guardar Proveedor</button>
        </div>

        <div class="section">
            <h2>Agregar Insumo</h2>
            <label>Foto:</label>
            <input type="file">
            <label>Descripción:</label>
            <textarea placeholder="Descripción breve del insumo"></textarea>
            <label>Proveedor:</label>
            <select>
                <option>Selecciona un proveedor</option>
            </select>
            <button>Agregar Insumo</button>
        </div>

        <div class="section">
            <h2>Inventario</h2>
            <p>Aquí se mostrarán los insumos disponibles (no implementado).</p>
            <button>Actualizar Inventario</button>
        </div>

        <div class="section">
            <h2>Agregar Receta</h2>
            <label>Nombre de la receta:</label>
            <input type="text">
            <label>Descripción:</label>
            <textarea></textarea>
            <label>Seleccionar Insumos:</label>
            <select multiple>
                <option>Insumo 1</option>
                <option>Insumo 2</option>
            </select>
            <button>Guardar Receta</button>
        </div>

        <div class="section">
            <h2>Orden</h2>
            <label>Seleccionar Recetas:</label>
            <select multiple>
                <option>Receta 1</option>
                <option>Receta 2</option>
            </select>
            <label>Comentarios:</label>
            <textarea></textarea>
            <label>Tipo de entrega:</label>
            <select>
                <option>Barra</option>
                <option>Entrega plataformas</option>
                <option>Entrega danser</option>
            </select>
            <button>Enviar a Comanda</button>
        </div>

        <div class="section">
            <h2>Comandas</h2>
            <p>Aquí se mostrarán los pedidos activos (no implementado).</p>
            <button>Completar Pedido</button>
        </div>

    </div>
</body>
</html>
